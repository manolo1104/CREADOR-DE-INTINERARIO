name: Recuperar carritos abandonados

on:
  schedule:
    # Cada 6 horas: revisa carritos abandonados y manda recordatorios.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al endpoint de recuperación
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.BLOG_AGENT_SECRET }}" \
            https://www.huasteca-potosina.com/api/cron/recuperar-carritos
