name: Correos automáticos (carritos + leads + cotizaciones)

on:
  schedule:
    # Cada hora. La secuencia es 1 h → 24 h → 72 h; con el cron anterior (cada
    # 6 h) el primer recordatorio salía hasta 6 horas tarde, cuando el cliente
    # ya había reservado en otro lado o perdido el interés.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al endpoint de recuperación
        run: |
          # -f hace que un 401 (secreto mal configurado) falle el job en vez de
          # pasar desapercibido como si no hubiera nada que enviar.
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.BLOG_AGENT_SECRET }}" \
            https://www.huasteca-potosina.com/api/cron/recuperar-carritos

      - name: Secuencia de correos a los leads del recomendador
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.BLOG_AGENT_SECRET }}" \
            https://www.huasteca-potosina.com/api/cron/secuencia-leads

      - name: Seguimiento de las cotizaciones (panel y bot)
        run: |
          # Las cotizaciones que Manolo manda a mano no tenían ningún
          # seguimiento. Este paso las retoma a la hora, a las 24 h y a las
          # 72 h — no arranca si el viaje es dentro de menos de 4 días, y se
          # pausa en cuanto el cliente confirma su reserva.
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.BLOG_AGENT_SECRET }}" \
            https://www.huasteca-potosina.com/api/cron/secuencia-cotizaciones
